[package]
name = "user-service"
version = "0.1.0"
edition = "2024"

[dependencies]
shared-kernel = { git = "ssh://git@github.com/gomoku-online/shared_kernel.git", tag = "v0.1.0" }
protos = { git = "ssh://git@github.com/gomoku-online/protos.git", branch = "develop" }
dotenvy = "0.15.7"
thiserror = "2.0.11"
config = { version = "0.15.13" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
dashmap = "7.0.0-rc2"
anyhow = "1.0.98"
chrono = "0.4.40"
async-trait = "0.1.88"
getset = "0.1.5"
strum = { version = "0.27.1", features = ["derive"] }
strum_macros = "0.27.1"
tracing = "0.1.41"
diesel-oci = { version = "0.3.1", features = ["dynamic-schema"] }
diesel = { version = "2.2.11" }
diesel_migrations = "2.2.0"
rand = "0.9.1"
uuid = { version = "1.17.0", features = ["v4"] }
diesel_logger = "0.4.0"
futures = "0.3.31"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
validator = { version = "0.20.0", features = ["derive"] }
bytes = "1.10.1"
log = "0.4.27"
regex = "1.11.1"
tonic = "0.14.1"
lazy_static = "1.5.0"

[dev-dependencies]
mockall = "0.13.1"
testcontainers = { version = "0.25.0" }
ctor = "0.5.0"
chrono = "0.4.40"
rand = "0.9.1"